<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聊天室</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 头像预览元素 -->
    <div class="profile-bar">
        &lt;img id="avatarPreview" src="data:image/svg+xml;base64,..." alt="头像预览"&gt;
        <input type="file" id="avatarInput" accept="image/*">
        <input type="text" id="nicknameInput" placeholder="输入昵称">
    </div>

    <!-- 聊天消息区域 -->
    <div id="messages"></div>

    <!-- 消息输入区域 -->
    <div class="input-area">
        <input type="text" id="messageInput" placeholder="输入消息...">
        <button id="sendBtn">发送</button>
        <input type="file" id="imageInput" accept="image/*">
    </div>

    <!-- 所有脚本放在 body 末尾 -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        // ===== 元素获取（此时 DOM 已完全加载）=====
        const avatarPreview = document.getElementById('avatarPreview');
        const avatarInput = document.getElementById('avatarInput');
        const nicknameInput = document.getElementById('nicknameInput');
        const messagesDiv = document.getElementById('messages');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const imageInput = document.getElementById('imageInput');

        // ===== Socket.IO 连接 =====
        const socket = io();

        // ===== 头像上传与预览 =====
        avatarInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            if (file.size > 2 * 1024 * 1024) {
                alert('图片不能超过 2MB');
                return;
            }
            const reader = new FileReader();
            reader.onload = function(event) {
                // 此时 avatarPreview 一定存在，因为脚本在 body 末尾
                avatarPreview.src = event.target.result;
                localStorage.setItem('avatar', event.target.result);
            };
            reader.readAsDataURL(file);
        });

        // ===== 昵称设置 =====
        nicknameInput.addEventListener('change', function() {
            localStorage.setItem('nickname', this.value);
        });

        // ===== 发送文本消息 =====
        function sendMessage() {
            const text = messageInput.value.trim();
            if (!text) return;
            const nickname = nicknameInput.value || '匿名用户';
            const avatar = localStorage.getItem('avatar') || '';
            socket.emit('chatMessage', { text, nickname, avatar });
            messageInput.value = '';
        }

        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') sendMessage();
        });

        // ===== 发送图片消息 =====
        imageInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            if (file.size > 2 * 1024 * 1024) {
                alert('图片不能超过 2MB');
                return;
            }
            const reader = new FileReader();
            reader.onload = function(event) {
                const nickname = nicknameInput.value || '匿名用户';
                const avatar = localStorage.getItem('avatar') || '';
                socket.emit('sendChatImage', {
                    image: event.target.result,
                    nickname,
                    avatar
                });
            };
            reader.readAsDataURL(file);
        });

        // ===== 接收消息 =====
        socket.on('chatMessage', function(data) {
            appendMessage(data);
        });

        socket.on('sendChatImage', function(data) {
            appendMessage(data, true);
        });

        // ===== 历史记录 =====
        socket.on('history', function(history) {
            history.forEach(function(msg) {
                appendMessage(msg, msg.image ? true : false);
            });
        });

        // ===== 渲染消息 =====
        function appendMessage(data, isImage) {
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message';

            const avatarImg = document.createElement('img');
            avatarImg.className = 'msg-avatar';
            avatarImg.src = data.avatar || 'data:image/svg+xml;base64,...';
            // 图片加载失败时使用默认头像
            avatarImg.onerror = function() {
                this.src = 'data:image/svg+xml;base64,...';
            };

            const contentDiv = document.createElement('div');
            contentDiv.className = 'msg-content';

            const nameSpan = document.createElement('span');
            nameSpan.className = 'msg-name';
            nameSpan.textContent = data.nickname || '匿名用户';

            const textDiv = document.createElement('div');
            textDiv.className = 'msg-text';
            if (isImage) {
                const img = document.createElement('img');
                img.className = 'msg-image';
                img.src = data.image;
                img.onerror = function() {
                    this.src = 'data:image/svg+xml;base64,...';
                };
                textDiv.appendChild(img);
            } else {
                textDiv.textContent = data.text;
            }

            contentDiv.appendChild(nameSpan);
            contentDiv.appendChild(textDiv);
            msgDiv.appendChild(avatarImg);
            msgDiv.appendChild(contentDiv);
            messagesDiv.appendChild(msgDiv);

            // 自动滚动到底部
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        // ===== 恢复本地存储的昵称和头像 =====
        const savedNickname = localStorage.getItem('nickname');
        const savedAvatar = localStorage.getItem('avatar');
        if (savedNickname) nicknameInput.value = savedNickname;
        if (savedAvatar) avatarPreview.src = savedAvatar;
    </script>
</body>
</html>
