<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>聊天室</title>
  <link id="favicon" rel="icon" type="image/png" href="">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg-deep: #0b0616;
      --glass-bg: rgba(28, 17, 52, 0.45);
      --glass-bg-strong: rgba(22, 12, 42, 0.78);
      --glass-border: rgba(216, 180, 254, 0.22);
      --glass-highlight: rgba(255, 255, 255, 0.12);
      --accent-purple: #9333ea;
      --accent-glow: #c084fc;
      --text-main: #f3e8ff;
      --text-muted: rgba(233, 213, 255, 0.65);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Microsoft YaHei', sans-serif;
      background: radial-gradient(circle at top left, #1e0b36, #0b0616 60%, #140826);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    .ambient-orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(85px);
      z-index: 0;
      pointer-events: none;
      opacity: 0.65;
      animation: floatOrb 14s ease-in-out infinite alternate;
    }
    .orb-1 { width: 380px; height: 380px; background: radial-gradient(circle, #7e22ce, #4c1d95); top: -80px; left: -60px; }
    .orb-2 { width: 420px; height: 420px; background: radial-gradient(circle, #a21caf, #581c87); bottom: -100px; right: -80px; animation-delay: -5s; }
    .orb-3 { width: 260px; height: 260px; background: radial-gradient(circle, #6366f1, #6b21a8); top: 45%; left: 55%; animation-delay: -9s; }
    @keyframes floatOrb {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(35px, -30px) scale(1.12); }
    }

    .liquid-glass {
      background: var(--glass-bg);
      backdrop-filter: blur(22px) saturate(165%);
      -webkit-backdrop-filter: blur(22px) saturate(165%);
      border: 1px solid var(--glass-border);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45), inset 0 1px 1px var(--glass-highlight);
    }

    /* 登录界面 */
    #loginScreen {
      position: relative; z-index: 1; display: flex; justify-content: center; align-items: center; height: 100vh; padding: 20px;
    }
    .login-card {
      padding: 36px 32px; border-radius: 24px; display: flex; flex-direction: column; align-items: center; gap: 18px; width: 100%; max-width: 380px;
    }
    .login-card h1 {
      font-size: 24px; font-weight: 600; letter-spacing: 1px;
      background: linear-gradient(135deg, #f3e8ff, #c084fc);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .login-row { display: flex; width: 100%; gap: 10px; }
    #loginScreen input {
      flex: 1; padding: 12px 16px; font-size: 15px; color: var(--text-main);
      background: rgba(255, 255, 255, 0.07); border: 1px solid var(--glass-border); border-radius: 14px; outline: none;
    }
    #loginScreen input::placeholder { color: var(--text-muted); }
    #loginScreen button {
      padding: 12px 22px; font-size: 15px; font-weight: 600;
      background: linear-gradient(135deg, #9333ea, #6b21a8); color: white;
      border: 1px solid rgba(255, 255, 255, 0.25); border-radius: 14px; cursor: pointer;
    }

    /* 聊天主容器 */
    #chatScreen {
      position: relative; z-index: 1; display: none; flex: 1; flex-direction: column;
      max-width: 860px; margin: 16px auto; width: calc(100% - 32px); height: calc(100vh - 32px);
      border-radius: 26px; overflow: hidden;
    }

    @keyframes screenShake {
      0%, 100% { transform: translate(0, 0); }
      15% { transform: translate(-8px, -4px); }
      30% { transform: translate(8px, 4px); }
      45% { transform: translate(-6px, 3px); }
      60% { transform: translate(6px, -3px); }
      75% { transform: translate(-3px, 2px); }
    }
    .shake-effect { animation: screenShake 0.45s ease-in-out; }

    /* 顶部栏 */
    #header {
      background: rgba(38, 20, 71, 0.55); backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--glass-border); padding: 15px 22px;
      display: flex; justify-content: space-between; align-items: center;
    }
    #header h2 { font-size: 19px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
    .header-right { display: flex; align-items: center; gap: 10px; }
    #onlineCount {
      font-size: 13px; color: var(--text-muted); background: rgba(255, 255, 255, 0.06);
      padding: 4px 10px; border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .header-btn {
      background: rgba(255, 255, 255, 0.09); color: var(--text-main);
      border: 1px solid var(--glass-border); padding: 5px 12px; border-radius: 12px; cursor: pointer; font-size: 12px;
    }
    .header-btn:hover { background: rgba(168, 85, 247, 0.35); border-color: var(--accent-glow); }

    /* 管理员面板 */
    #adminPanel {
      background: rgba(59, 24, 95, 0.55); border-bottom: 1px solid var(--glass-border);
      padding: 10px 22px; display: none; align-items: center; gap: 10px;
    }
    #adminPanel input {
      padding: 6px 12px; border: 1px solid var(--glass-border); border-radius: 10px;
      background: rgba(0, 0, 0, 0.35); color: var(--text-main); outline: none; color-scheme: dark;
    }
    #adminPanel button {
      padding: 6px 14px; background: linear-gradient(135deg, #d97706, #b45309);
      color: white; border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 10px; cursor: pointer; font-size: 13px;
    }

    /* 语音通话状态横幅 */
    #callBanner {
      display: none;
      background: linear-gradient(135deg, rgba(126, 34, 206, 0.75), rgba(76, 29, 149, 0.85));
      backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(216, 180, 254, 0.4);
      padding: 12px 22px;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      animation: msgPop 0.25s ease-out;
    }
    .call-info { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 500; }
    .pulse-dot {
      width: 10px; height: 10px; border-radius: 50%; background: #4ade80;
      box-shadow: 0 0 10px #4ade80; animation: pulseAnim 1.2s infinite;
    }
    @keyframes pulseAnim {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.4); opacity: 0.6; }
    }
    .call-actions { display: flex; gap: 8px; }
    .call-btn {
      padding: 6px 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.25);
      color: white; font-size: 12px; font-weight: 600; cursor: pointer;
    }
    .btn-accept { background: #16a34a; }
    .btn-hangup { background: #dc2626; }
    .btn-mute { background: rgba(255, 255, 255, 0.15); }

    /* 在线用户栏 */
    #onlineUsers {
      background: rgba(18, 10, 34, 0.45); border-bottom: 1px solid var(--glass-border);
      padding: 8px 22px; max-height: 130px; overflow-y: auto;
    }
    #onlineUsers .user {
      padding: 5px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      display: flex; justify-content: space-between; align-items: center; font-size: 13px;
    }
    #onlineUsers .user:last-child { border-bottom: none; }
    #onlineUsers .user .btn-group { display: flex; gap: 6px; flex-wrap: wrap; }
    .voice-btn {
      font-size: 11px; padding: 3px 9px;
      background: rgba(56, 189, 248, 0.25); border: 1px solid rgba(125, 211, 252, 0.4);
      color: #bae6fd; border-radius: 8px; cursor: pointer;
    }
    .voice-btn:hover { background: rgba(56, 189, 248, 0.45); }
    .poke-btn {
      font-size: 11px; padding: 3px 9px;
      background: rgba(168, 85, 247, 0.35); border: 1px solid rgba(216, 180, 254, 0.45);
      color: #f3e8ff; border-radius: 8px; cursor: pointer;
    }
    .mute-btn {
      font-size: 11px; padding: 3px 9px;
      background: rgba(239, 68, 68, 0.35); border: 1px solid rgba(248, 113, 113, 0.4);
      color: #fecaca; border-radius: 8px; cursor: pointer;
    }
    .unmute-btn {
      font-size: 11px; padding: 3px 9px;
      background: rgba(34, 197, 94, 0.3); border: 1px solid rgba(74, 222, 128, 0.4);
      color: #bbf7d0; border-radius: 8px; cursor: pointer;
    }

    /* 消息区域 */
    #messages {
      flex: 1; overflow-y: auto; padding: 20px 22px; display: flex; flex-direction: column; gap: 12px;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(192, 132, 252, 0.25); border-radius: 10px; }

    .message {
      padding: 11px 16px; background: rgba(255, 255, 255, 0.07); backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 18px 18px 18px 4px; max-width: 78%; width: fit-content; align-self: flex-start;
      animation: msgPop 0.22s ease-out;
    }
    .message.self {
      align-self: flex-end;
      background: linear-gradient(135deg, rgba(147, 51, 234, 0.55), rgba(107, 33, 168, 0.65));
      border: 1px solid rgba(216, 180, 254, 0.35);
      border-radius: 18px 18px 4px 18px;
    }
    @keyframes msgPop {
      from { opacity: 0; transform: translateY(8px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .message-meta { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
    .message .nickname { font-weight: 600; font-size: 13px; color: #e9d5ff; }
    .message .time { font-size: 11px; color: var(--text-muted); }
    .message .admin-badge {
      background: linear-gradient(135deg, #f59e0b, #d97706); color: white;
      font-size: 10px; font-weight: bold; padding: 2px 6px; border-radius: 6px;
    }
    .message img { max-width: 230px; max-height: 230px; border-radius: 12px; margin-top: 6px; display: block; cursor: pointer; }
    .message .text { word-break: break-word; display: block; line-height: 1.5; font-size: 14.5px; color: #faf5ff; }

    .system-message {
      align-self: center; text-align: center; color: var(--text-muted); font-size: 12px;
      background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 4px 14px; border-radius: 20px;
    }

    /* 底部输入区 */
    #inputArea {
      background: rgba(28, 16, 52, 0.6); backdrop-filter: blur(20px);
      border-top: 1px solid var(--glass-border); padding: 12px 18px;
      display: flex; align-items: center; gap: 10px; position: relative;
    }
    #inputArea input[type="text"] {
      flex: 1; padding: 11px 16px; border: 1px solid var(--glass-border); border-radius: 20px;
      font-size: 14px; color: var(--text-main); background: rgba(255, 255, 255, 0.07); outline: none;
    }
    #inputArea input[type="text"]::placeholder { color: var(--text-muted); }
    #inputArea button { border: 1px solid var(--glass-border); border-radius: 18px; cursor: pointer; }
    #sendBtn {
      padding: 10px 20px; background: linear-gradient(135deg, #9333ea, #7e22ce);
      color: white; font-size: 14px; font-weight: 600;
    }
    #emojiBtn, #imageBtn { background: rgba(255, 255, 255, 0.08); font-size: 18px; padding: 8px 12px; }

    /* Emoji 面板 */
    #emojiPanel {
      display: none; background: var(--glass-bg-strong); backdrop-filter: blur(26px);
      border: 1px solid var(--glass-border); border-radius: 18px; padding: 12px;
      position: absolute; bottom: 72px; left: 18px; max-width: 325px; z-index: 20;
    }
    #emojiPanel span { font-size: 24px; cursor: pointer; padding: 6px; display: inline-block; user-select: none; }
    #emojiPanel span:hover { background: rgba(192, 132, 252, 0.25); border-radius: 10px; }

    @media (max-width: 600px) {
      #chatScreen { margin: 0; width: 100%; height: 100vh; border-radius: 0; border: none; }
    }
  </style>
</head>
<body>

  <div class="ambient-orb orb-1"></div>
  <div class="ambient-orb orb-2"></div>
  <div class="ambient-orb orb-3"></div>

  <!-- 隐藏的远程音频播放器 -->
  <audio id="remoteAudio" autoplay playsinline></audio>

  <!-- 登录界面 -->
  <div id="loginScreen">
    <div class="login-card liquid-glass">
      <h1>✨ 暗紫秘境聊天室</h1>
      <div class="login-row">
        <input type="text" id="nicknameInput" placeholder="请输入你的昵称..." maxlength="20" onkeydown="if(event.key==='Enter')joinChat()">
        <button onclick="joinChat()">进入</button>
      </div>
    </div>
  </div>

  <!-- 聊天界面 -->
  <div id="chatScreen" class="liquid-glass">
    <div id="header">
      <h2>🔮 聊天室</h2>
      <div class="header-right">
        <span id="onlineCount">在线: 0</span>
        <button id="notifyToggleBtn" class="header-btn" onclick="toggleNotificationSetting()">🔔 提醒: 开</button>
        <button id="toggleAdminBtn" class="header-btn" onclick="toggleAdminPanel()">⚙️ 管理</button>
      </div>
    </div>

    <!-- 语音通话状态横幅 -->
    <div id="callBanner">
      <div class="call-info">
        <span class="pulse-dot"></span>
        <span id="callStatusText">正在呼叫...</span>
      </div>
      <div class="call-actions" id="callActions"></div>
    </div>

    <!-- 管理员登录面板 -->
    <div id="adminPanel">
      <input type="password" id="adminPassword" placeholder="管理员密码" onkeydown="if(event.key==='Enter')adminLogin()">
      <button onclick="adminLogin()">登录</button>
      <span id="adminStatus"></span>
    </div>

    <!-- 在线用户列表 -->
    <div id="onlineUsers" style="display: none;"></div>

    <!-- 消息区域 -->
    <div id="messages"></div>

    <!-- Emoji 面板 -->
    <div id="emojiPanel">
      <span onclick="insertEmoji('😀')">😀</span>
      <span onclick="insertEmoji('😂')">😂</span>
      <span onclick="insertEmoji('😍')">😍</span>
      <span onclick="insertEmoji('😎')">😎</span>
      <span onclick="insertEmoji('🤔')">🤔</span>
      <span onclick="insertEmoji('👍')">👍</span>
      <span onclick="insertEmoji('🎉')">🎉</span>
      <span onclick="insertEmoji('❤️')">❤️</span>
      <span onclick="insertEmoji('🔥')">🔥</span>
      <span onclick="insertEmoji('✨')">✨</span>
      <span onclick="insertEmoji('😭')">😭</span>
      <span onclick="insertEmoji('😡')">😡</span>
      <span onclick="insertEmoji('🤣')">🤣</span>
      <span onclick="insertEmoji('😊')">😊</span>
      <span onclick="insertEmoji('😉')">😉</span>
      <span onclick="insertEmoji('😴')">😴</span>
      <span onclick="insertEmoji('🤗')">🤗</span>
      <span onclick="insertEmoji('😇')">😇</span>
      <span onclick="insertEmoji('🥳')">🥳</span>
      <span onclick="insertEmoji('🤯')">🤯</span>
      <span onclick="insertEmoji('🐔')">🐔</span>
    </div>

    <!-- 输入区域 -->
    <div id="inputArea">
      <button id="emojiBtn" onclick="toggleEmojiPanel()">😊</button>
      <input type="text" id="messageInput" placeholder="输入消息..." onkeydown="if(event.key==='Enter')sendMessage()">
      <button id="imageBtn" onclick="document.getElementById('imageInput').click()">🖼️</button>
      <input type="file" id="imageInput" accept="image/*" style="display: none;" onchange="sendImage(this.files[0])">
      <button id="sendBtn" onclick="sendMessage()">发送</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    let socket;
    let myNickname = '';
    let isAdmin = false;
    let currentUsers = [];
    let notifyEnabled = true;
    let unreadCount = 0;

    // ========== WebRTC 语音通话变量 ==========
    let peerConnection = null;
    let localStream = null;
    let callTarget = null;
    let pendingOffer = null;
    let isMuted = false;
    let callTimer = null;
    let callSeconds = 0;
    let iceCandidateQueue = []; // 缓存提前到达的 ICE 路径

    // 配置 STUN + 免费公共 TURN 中继服务器，解决跨网防火墙无法直连无声问题
    const rtcConfig = {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' },
        {
          urls: 'turn:openrelay.metered.ca:80',
          username: 'openrelayproject',
          credential: 'openrelayproject'
        },
        {
          urls: 'turn:openrelay.metered.ca:443',
          username: 'openrelayproject',
          credential: 'openrelayproject'
        }
      ]
    };

    // ========== 动态 Favicon ==========
    function updateFavicon(hasBadge) {
      const canvas = document.createElement('canvas');
      canvas.width = 64; canvas.height = 64;
      const ctx = canvas.getContext('2d');

      const grad = ctx.createLinearGradient(0, 0, 64, 64);
      grad.addColorStop(0, '#a855f7');
      grad.addColorStop(1, '#581c87');
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(32, 32, 28, 0, Math.PI * 2); ctx.fill();

      ctx.fillStyle = '#faf5ff';
      ctx.beginPath(); ctx.roundRect(16, 20, 32, 22, 6); ctx.fill();
      ctx.beginPath(); ctx.moveTo(22, 42); ctx.lineTo(18, 49); ctx.lineTo(30, 42); ctx.closePath(); ctx.fill();

      if (hasBadge) {
        ctx.fillStyle = '#ff3b30';
        ctx.beginPath(); ctx.arc(50, 14, 12, 0, Math.PI * 2); ctx.fill();
        ctx.lineWidth = 3; ctx.strokeStyle = '#ffffff'; ctx.stroke();
      }
      document.getElementById('favicon').href = canvas.toDataURL('image/png');
    }

    // ========== 提示音 ==========
    function playNotificationSound() {
      if (!notifyEnabled) return;
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1320, ctx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.15, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.25);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(); osc.stop(ctx.currentTime + 0.25);
      } catch (e) {}
    }

    // ========== 初始化 ==========
    window.onload = function() {
      updateFavicon(false);
      const savedNickname = localStorage.getItem('chatroom_nickname');
      if (savedNickname) document.getElementById('nicknameInput').value = savedNickname;
    };

    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) {
        unreadCount = 0;
        document.title = '聊天室';
        updateFavicon(false);
      }
    });

    function requestNotificationPermission() {
      if ('Notification' in window && Notification.permission === 'default') {
        Notification.requestPermission();
      }
    }

    function toggleNotificationSetting() {
      notifyEnabled = !notifyEnabled;
      document.getElementById('notifyToggleBtn').textContent = notifyEnabled ? '🔔 提醒: 开' : '🔕 提醒: 关';
      if (notifyEnabled) {
        requestNotificationPermission();
        playNotificationSound();
      }
    }

    function notifyNewMessage(msg) {
      if (msg.nickname === myNickname) return;
      playNotificationSound();
      if (document.hidden) {
        unreadCount++;
        document.title = `(${unreadCount}条新消息) 聊天室`;
        updateFavicon(true);
        if (notifyEnabled && 'Notification' in window && Notification.permission === 'granted') {
          const n = new Notification(`新消息 - ${msg.nickname}`, {
            body: msg.text || '[图片消息]', tag: 'chatroom-new-msg'
          });
          n.onclick = function() { window.focus(); this.close(); };
        }
      }
    }

    // ========== 登录 ==========
    function joinChat() {
      const nickname = document.getElementById('nicknameInput').value.trim();
      if (!nickname) { alert('请输入昵称'); return; }
      myNickname = nickname;
      localStorage.setItem('chatroom_nickname', nickname);
      requestNotificationPermission();
      
      socket = io();
      socket.emit('join', nickname);
      socket.emit('get history');
      
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('chatScreen').style.display = 'flex';
      setupSocketListeners();
    }

    // ========== WebRTC 语音通话核心逻辑 ==========
    function createPeerConnection(targetUser) {
      const pc = new RTCPeerConnection(rtcConfig);

      pc.onicecandidate = (event) => {
        if (event.candidate) {
          socket.emit('call-ice', { to: targetUser, candidate: event.candidate });
        }
      };

      pc.ontrack = (event) => {
        const remoteAudio = document.getElementById('remoteAudio');
        remoteAudio.srcObject = event.streams[0];
        // 显式触发音频播放，防止浏览器拦截自动播放
        remoteAudio.play().catch(err => console.warn('音频播放需交互:', err));
      };

      pc.onconnectionstatechange = () => {
        if (pc.connectionState === 'connected') {
          startCallTimer();
        } else if (['disconnected', 'failed', 'closed'].includes(pc.connectionState)) {
          endCallUI('通话已结束');
        }
      };

      return pc;
    }

    async function flushIceQueue() {
      if (!peerConnection || !peerConnection.remoteDescription) return;
      while (iceCandidateQueue.length > 0) {
        const candidate = iceCandidateQueue.shift();
        try {
          await peerConnection.addIceCandidate(new RTCIceCandidate(candidate));
        } catch (e) {}
      }
    }

    // 发起语音呼叫
    async function startVoiceCall(targetNickname) {
      if (peerConnection || callTarget) {
        alert('当前正在通话中，请先挂断');
        return;
      }
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
      } catch (err) {
        alert('无法访问麦克风，请确保浏览器已授权麦克风权限（且页面通过 HTTPS 或 localhost 访问）');
        return;
      }

      iceCandidateQueue = [];
      callTarget = targetNickname;
      peerConnection = createPeerConnection(targetNickname);
      localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

      const offer = await peerConnection.createOffer();
      await peerConnection.setLocalDescription(offer);

      socket.emit('call-offer', { to: targetNickname, offer });
      showCallBanner(`📞 正在呼叫 ${targetNickname}...`, [
        { text: '取消呼叫', cls: 'btn-hangup', fn: () => hangupCall() }
      ]);
    }

    // 接听来电
    async function acceptIncomingCall() {
      if (!pendingOffer || !callTarget) return;
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
      } catch (err) {
        alert('无法获取麦克风权限，已自动拒绝来电');
        rejectIncomingCall();
        return;
      }

      peerConnection = createPeerConnection(callTarget);
      localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

      await peerConnection.setRemoteDescription(new RTCSessionDescription(pendingOffer));
      await flushIceQueue();

      const answer = await peerConnection.createAnswer();
      await peerConnection.setLocalDescription(answer);

      socket.emit('call-answer', { to: callTarget, answer });
      pendingOffer = null;
      startCallTimer();
    }

    // 拒绝来电
    function rejectIncomingCall() {
      if (callTarget) {
        socket.emit('call-reject', { to: callTarget, reason: '对方拒绝了语音通话' });
      }
      endCallUI();
    }

    // 挂断通话
    function hangupCall() {
      if (callTarget) {
        socket.emit('call-hangup', { to: callTarget });
      }
      endCallUI('已挂断通话');
    }

    // 切换麦克风静音
    function toggleMuteMic() {
      if (!localStream) return;
      isMuted = !isMuted;
      localStream.getAudioTracks().forEach(track => { track.enabled = !isMuted; });
      const btn = document.getElementById('muteMicBtn');
      if (btn) btn.textContent = isMuted ? '🔇 取消静音' : '🎙️ 静音';
    }

    // 通话计时与UI更新
    function startCallTimer() {
      callSeconds = 0;
      clearInterval(callTimer);
      updateInCallBanner();
      callTimer = setInterval(() => {
        callSeconds++;
        updateInCallBanner();
      }, 1000);
    }

    function updateInCallBanner() {
      const mins = String(Math.floor(callSeconds / 60)).padStart(2, '0');
      const secs = String(callSeconds % 60).padStart(2, '0');
      showCallBanner(`🎧 与 ${callTarget} 语音通话中 (${mins}:${secs})`, [
        { id: 'muteMicBtn', text: isMuted ? '🔇 取消静音' : '🎙️ 静音', cls: 'btn-mute', fn: toggleMuteMic },
        { text: '挂断', cls: 'btn-hangup', fn: hangupCall }
      ]);
    }

    function showCallBanner(text, buttons) {
      const banner = document.getElementById('callBanner');
      const statusText = document.getElementById('callStatusText');
      const actions = document.getElementById('callActions');

      banner.style.display = 'flex';
      statusText.textContent = text;
      actions.innerHTML = '';

      buttons.forEach(b => {
        const btn = document.createElement('button');
        if (b.id) btn.id = b.id;
        btn.className = `call-btn ${b.cls}`;
        btn.textContent = b.text;
        btn.onclick = b.fn;
        actions.appendChild(btn);
      });
    }

    function endCallUI(notice) {
      clearInterval(callTimer);
      callTimer = null;
      if (peerConnection) {
        peerConnection.close();
        peerConnection = null;
      }
      if (localStream) {
        localStream.getTracks().forEach(track => track.stop());
        localStream = null;
      }
      callTarget = null;
      pendingOffer = null;
      iceCandidateQueue = [];
      isMuted = false;
      document.getElementById('callBanner').style.display = 'none';
      if (notice) renderSystemMessage(`📞 ${notice}`);
    }

    // ========== Socket 事件监听 ==========
    function setupSocketListeners() {
      socket.on('chat message', (msg) => {
        renderMessage(msg);
        notifyNewMessage(msg);
      });
      socket.on('history', (history) => history.forEach(msg => renderMessage(msg)));
      socket.on('system message', (data) => renderSystemMessage(data.text));
      socket.on('online users', (users) => {
        currentUsers = users;
        renderOnlineUsers(users);
      });
      
      socket.on('admin login success', () => {
        isAdmin = true;
        document.getElementById('adminStatus').textContent = '✅ 管理员已登录';
        document.getElementById('adminStatus').style.color = '#86efac';
        document.getElementById('adminPassword').disabled = true;
        renderOnlineUsers(currentUsers);
      });
      
      socket.on('admin login fail', () => {
        document.getElementById('adminStatus').textContent = '❌ 密码错误';
        document.getElementById('adminStatus').style.color = '#fca5a5';
      });
      
      socket.on('muted notice', (data) => alert(data.message));

      // 接收戳一戳
      socket.on('poked', (data) => {
        const chatBox = document.getElementById('chatScreen');
        chatBox.classList.remove('shake-effect');
        void chatBox.offsetWidth;
        chatBox.classList.add('shake-effect');
        playNotificationSound();
        if (document.hidden && notifyEnabled && 'Notification' in window && Notification.permission === 'granted') {
          new Notification('👉 你被管理员戳了一下', {
            body: `管理员 ${data.from} 正在呼叫你！`, tag: 'chatroom-poke'
          });
        }
      });

      // ========== 语音通话信令接收 ==========
      socket.on('call-offer', ({ from, offer }) => {
        if (peerConnection || callTarget) {
          socket.emit('call-reject', { to: from, reason: '对方正在通话中' });
          return;
        }
        iceCandidateQueue = [];
        callTarget = from;
        pendingOffer = offer;
        playNotificationSound();

        showCallBanner(`📲 ${from} 邀请你进行语音通话...`, [
          { text: '接听', cls: 'btn-accept', fn: acceptIncomingCall },
          { text: '拒绝', cls: 'btn-hangup', fn: rejectIncomingCall }
        ]);

        if (document.hidden && notifyEnabled && 'Notification' in window && Notification.permission === 'granted') {
          new Notification('📲 语音通话邀请', { body: `${from} 正在呼叫你...`, tag: 'chatroom-call' });
        }
      });

      socket.on('call-answer', async ({ answer }) => {
        if (peerConnection) {
          await peerConnection.setRemoteDescription(new RTCSessionDescription(answer));
          await flushIceQueue();
          startCallTimer();
        }
      });

      socket.on('call-ice', async ({ candidate }) => {
        if (!candidate) return;
        if (peerConnection && peerConnection.remoteDescription) {
          try {
            await peerConnection.addIceCandidate(new RTCIceCandidate(candidate));
          } catch (e) {}
        } else {
          iceCandidateQueue.push(candidate);
        }
      });

      socket.on('call-reject', ({ reason }) => endCallUI(reason));
      socket.on('call-hangup', ({ from }) => endCallUI(`${from} 挂断了通话`));
      socket.on('call-ended', ({ reason }) => endCallUI(reason));
    }

    // ========== 常规操作 ==========
    function sendMessage() {
      const input = document.getElementById('messageInput');
      const text = input.value.trim();
      if (!text) return;
      socket.emit('chat message', { text });
      input.value = '';
      document.getElementById('emojiPanel').style.display = 'none';
    }

    function sendImage(file) {
      if (!file) return;
      if (file.size > 2 * 1024 * 1024) { alert('图片不能超过 2MB'); return; }
      const reader = new FileReader();
      reader.onload = (e) => socket.emit('chat message', { text: '', image: e.target.result });
      reader.readAsDataURL(file);
      document.getElementById('imageInput').value = '';
    }

    function toggleEmojiPanel() {
      const panel = document.getElementById('emojiPanel');
      panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
    }

    function insertEmoji(emoji) {
      const input = document.getElementById('messageInput');
      input.value += emoji;
      input.focus();
    }

    function toggleAdminPanel() {
      const panel = document.getElementById('adminPanel');
      panel.style.display = panel.style.display === 'flex' ? 'none' : 'flex';
    }

    function adminLogin() {
      const password = document.getElementById('adminPassword').value;
      socket.emit('admin login', password);
    }

    function pokeUser(nickname) { socket.emit('poke user', nickname); }

    function muteUser(nickname) {
      const duration = prompt(`请输入对 [${nickname}] 的禁言时长（分钟），0 表示永久禁言：`);
      if (duration === null) return;
      socket.emit('mute user', { nickname, duration: parseInt(duration) || 0 });
    }

    function unmuteUser(nickname) { socket.emit('unmute user', nickname); }

    // ========== 渲染 ==========
    function renderMessage(msg) {
      const container = document.getElementById('messages');
      const div = document.createElement('div');
      div.className = 'message' + (msg.nickname === myNickname ? ' self' : '');
      
      let html = '<div class="message-meta">';
      if (msg.isAdmin) html += '<span class="admin-badge">管理员</span>';
      html += `<span class="nickname">${escapeHtml(msg.nickname)}</span>`;
      html += `<span class="time">${escapeHtml(msg.time || '')}</span>`;
      html += '</div>';
      
      if (msg.text) html += `<span class="text">${escapeHtml(msg.text)}</span>`;
      if (msg.image && msg.image.startsWith('data:image/')) {
        html += `<img src="${msg.image}" alt="图片" onclick="window.open(this.src)">`;
      }
      
      div.innerHTML = html;
      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
    }

    function renderSystemMessage(text) {
      const container = document.getElementById('messages');
      const div = document.createElement('div');
      div.className = 'system-message';
      div.textContent = text;
      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
    }

    function renderOnlineUsers(users) {
      const container = document.getElementById('onlineUsers');
      container.style.display = 'block';
      container.innerHTML = '';
      
      users.forEach(user => {
        const div = document.createElement('div');
        div.className = 'user';
        
        const nameSpan = document.createElement('span');
        nameSpan.textContent = `${user.isAdmin ? '👑 ' : ''}${user.nickname}`;
        div.appendChild(nameSpan);
        
        if (user.nickname !== myNickname) {
          const btnGroup = document.createElement('div');
          btnGroup.className = 'btn-group';

          const voiceBtn = document.createElement('button');
          voiceBtn.className = 'voice-btn';
          voiceBtn.textContent = '📞 语音';
          voiceBtn.onclick = () => startVoiceCall(user.nickname);
          btnGroup.appendChild(voiceBtn);

          if (isAdmin) {
            const pokeBtn = document.createElement('button');
            pokeBtn.className = 'poke-btn';
            pokeBtn.textContent = '👉 戳一戳(Beta)';
            pokeBtn.onclick = () => pokeUser(user.nickname);

            const muteBtn = document.createElement('button');
            muteBtn.className = 'mute-btn';
            muteBtn.textContent = '禁言';
            muteBtn.onclick = () => muteUser(user.nickname);
            
            const unmuteBtn = document.createElement('button');
            unmuteBtn.className = 'unmute-btn';
            unmuteBtn.textContent = '解禁';
            unmuteBtn.onclick = () => unmuteUser(user.nickname);
            
            btnGroup.appendChild(pokeBtn);
            btnGroup.appendChild(muteBtn);
            btnGroup.appendChild(unmuteBtn);
          }
          
          div.appendChild(btnGroup);
        }
        
        container.appendChild(div);
      });
      
      document.getElementById('onlineCount').textContent = `在线: ${users.length}`;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
  </script>
</body>
</html>
