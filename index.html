<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>聊天室</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💬</text></svg>">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .chat-container {
      width: 90%;
      max-width: 800px;
      height: 90vh;
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .chat-header h1 {
      font-size: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .header-actions button {
      background: rgba(255, 255, 255, 0.2);
      border: none;
      color: white;
      padding: 8px 15px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.3s;
    }

    .header-actions button:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    .online-count {
      background: rgba(255, 255, 255, 0.2);
      padding: 5px 12px;
      border-radius: 15px;
      font-size: 13px;
    }

    .messages-area {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      background: #f5f5f5;
    }

    .message {
      margin-bottom: 15px;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }

    .message-content {
      background: white;
      padding: 10px 15px;
      border-radius: 15px;
      border-top-left-radius: 5px;
      max-width: 70%;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }

    .message-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 5px;
    }

    .message-nickname {
      font-weight: bold;
      font-size: 14px;
      color: #333;
    }

    .admin-badge {
      background: #ff4757;
      color: white;
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 10px;
    }

    .message-time {
      font-size: 11px;
      color: #999;
    }

    .message-text {
      font-size: 14px;
      color: #333;
      word-break: break-word;
    }

    .system-message {
      text-align: center;
      margin: 10px 0;
      padding: 8px 15px;
      background: #fff3cd;
      border-radius: 10px;
      font-size: 13px;
      color: #856404;
      display: inline-block;
      width: 100%;
    }

    .system-message.error {
      background: #f8d7da;
      color: #721c24;
    }

    .system-message.mute {
      background: #ffeeba;
      color: #856404;
    }

    .input-area {
      padding: 15px 20px;
      background: white;
      border-top: 1px solid #eee;
      display: flex;
      gap: 10px;
    }

    .input-area input {
      flex: 1;
      padding: 12px 15px;
      border: 2px solid #e0e0e0;
      border-radius: 25px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.3s;
    }

    .input-area input:focus {
      border-color: #667eea;
    }

    .input-area button {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 12px 25px;
      border-radius: 25px;
      cursor: pointer;
      font-size: 14px;
      transition: transform 0.2s;
    }

    .input-area button:hover {
      transform: scale(1.05);
    }

    /* 管理面板 */
    .admin-panel {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: white;
      border-radius: 15px;
      padding: 25px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      z-index: 1000;
      width: 400px;
      max-width: 90%;
      display: none;
    }

    .admin-panel.show {
      display: block;
    }

    .admin-panel h2 {
      margin-bottom: 20px;
      color: #333;
    }

    .admin-panel input {
      width: 100%;
      padding: 10px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      margin-bottom: 15px;
      font-size: 14px;
    }

    .admin-panel button {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      margin-right: 10px;
    }

    .admin-panel .close-btn {
      background: #999;
    }

    .user-list {
      max-height: 200px;
      overflow-y: auto;
      margin: 15px 0;
    }

    .user-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px;
      border-bottom: 1px solid #eee;
    }

    .user-item .user-name {
      font-size: 14px;
    }

    .user-item .user-actions {
      display: flex;
      gap: 5px;
    }

    .user-item .user-actions select {
      padding: 5px;
      border: 1px solid #ddd;
      border-radius: 5px;
      font-size: 12px;
    }

    .user-item .user-actions button {
      background: #ff4757;
      color: white;
      border: none;
      padding: 5px 10px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 12px;
    }

    .user-item .user-actions button.unmute {
      background: #28a745;
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      z-index: 999;
      display: none;
    }

    .overlay.show {
      display: block;
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="chat-header">
      <h1>💬 聊天室</h1>
      <div class="header-actions">
        <span class="online-count">👥 <span id="onlineCount">0</span> 人在线</span>
        <button onclick="openAdminPanel()">👑 管理</button>
        <button onclick="changeNickname()">✏️ 修改昵称</button>
      </div>
    </div>
    
    <div class="messages-area" id="messagesArea"></div>
    
    <div class="input-area">
      <input type="text" id="messageInput" placeholder="输入消息..." onkeypress="handleKeyPress(event)">
      <button onclick="sendMessage()">发送</button>
    </div>
  </div>

  <!-- 管理面板 -->
  <div class="overlay" id="overlay" onclick="closeAdminPanel()"></div>
  <div class="admin-panel" id="adminPanel">
    <h2>👑 管理面板</h2>
    <div id="adminLoginSection">
      <input type="password" id="adminPassword" placeholder="输入管理员密码">
      <button onclick="adminLogin()">登录</button>
    </div>
    <div id="adminControls" style="display: none;">
      <h3>在线用户</h3>
      <div class="user-list" id="userList"></div>
    </div>
    <button class="close-btn" onclick="closeAdminPanel()">关闭</button>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let isAdmin = false;
    let unreadCount = 0;
    let isPageHidden = false;

    // ========== 红点提醒功能 ==========
    
    // 动态生成带红点的 favicon
    function updateFavicon(count) {
      const canvas = document.createElement('canvas');
      canvas.width = 32;
      canvas.height = 32;
      const ctx = canvas.getContext('2d');
      
      // 绘制基础图标（笑脸）
      ctx.font = '24px serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('😊', 16, 16);
      
      // 如果有未读消息，绘制红点
      if (count > 0) {
        // 绘制红色圆形徽章
        ctx.beginPath();
        ctx.arc(26, 6, 8, 0, 2 * Math.PI);
        ctx.fillStyle = '#ff0000';
        ctx.fill();
        ctx.strokeStyle = 'white';
        ctx.lineWidth = 2;
        ctx.stroke();
        
        // 绘制数字
        if (count <= 99) {
          ctx.fillStyle = 'white';
          ctx.font = 'bold 10px Arial';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(count > 9 ? '9+' : count.toString(), 26, 7);
        }
      }
      
      // 更新 favicon
      const link = document.querySelector('link[rel="icon"]');
      if (link) {
        link.href = canvas.toDataURL('image/png');
      }
    }

    // 监听页面可见性变化
    document.addEventListener('visibilitychange', () => {
      isPageHidden = document.hidden;
      if (!document.hidden) {
        // 页面回到前台，清除未读标记
        unreadCount = 0;
        updateFavicon(0);
        document.title = '聊天室';
      }
    });

    // 更新未读计数和标题
    function incrementUnread() {
      if (isPageHidden) {
        unreadCount++;
        updateFavicon(unreadCount);
        document.title = `(${unreadCount}) 聊天室`;
      }
    }

    // ========== 昵称管理 ==========

    // 获取或设置昵称
    let nickname = localStorage.getItem('chatNickname');
    if (!nickname) {
      nickname = prompt('请输入你的昵称：');
      if (!nickname) nickname = '匿名用户';
      localStorage.setItem('chatNickname', nickname);
    }
    socket.emit('set nickname', nickname);

    // 修改昵称
    function changeNickname() {
      const newNickname = prompt('请输入新昵称：', nickname);
      if (newNickname && newNickname.trim()) {
        nickname = newNickname.trim();
        localStorage.setItem('chatNickname', nickname);
        socket.emit('set nickname', nickname);
        showSystemMessage('你已修改昵称为：' + nickname);
      }
    }

    // ========== 消息处理 ==========

    // 加载历史消息
    socket.on('allMessages', (messages) => {
      messages.forEach(msg => {
        if (typeof msg === 'string') {
          // 兼容旧格式
          renderMessage({
            avatar: '😊',
            nickname: '历史消息',
            text: msg,
            time: '',
            isAdmin: false
          });
        } else {
          renderMessage(msg);
        }
      });
      scrollToBottom();
    });

    // 接收新消息
    socket.on('chat message', (msg) => {
      renderMessage(msg);
      incrementUnread(); // 页面不在前台时增加未读计数
      scrollToBottom();
    });

    // 渲染消息
    function renderMessage(msg) {
      const messagesArea = document.getElementById('messagesArea');
      const messageDiv = document.createElement('div');
      messageDiv.className = 'message';
      
      messageDiv.innerHTML = `
        <div class="message-avatar">${msg.avatar || '😊'}</div>
        <div class="message-content">
          <div class="message-header">
            <span class="message-nickname">${escapeHtml(msg.nickname)}</span>
            ${msg.isAdmin ? '<span class="admin-badge">管理员</span>' : ''}
            <span class="message-time">${msg.time || ''}</span>
          </div>
          <div class="message-text">${escapeHtml(msg.text)}</div>
        </div>
      `;
      
      messagesArea.appendChild(messageDiv);
    }

    // 系统消息
    socket.on('system notification', (data) => {
      showSystemMessage(data.text, data.type);
    });

    function showSystemMessage(text, type = '') {
      const messagesArea = document.getElementById('messagesArea');
      const systemDiv = document.createElement('div');
      systemDiv.className = `system-message ${type}`;
      systemDiv.textContent = text;
      messagesArea.appendChild(systemDiv);
      scrollToBottom();
    }

    // 发送消息
    function sendMessage() {
      const input = document.getElementById('messageInput');
      const text = input.value.trim();
      if (text) {
        socket.emit('chat message', { text });
        input.value = '';
      }
    }

    function handleKeyPress(event) {
      if (event.key === 'Enter') {
        sendMessage();
      }
    }

    // ========== 在线用户 ==========

    socket.on('online users', (users) => {
      document.getElementById('onlineCount').textContent = users.length;
      updateUserList(users);
    });

    function updateUserList(users) {
      const userList = document.getElementById('userList');
      userList.innerHTML = '';
      
      users.forEach((user, index) => {
        const userDiv = document.createElement('div');
        userDiv.className = 'user-item';
        
        const socketId = Array.from(socket.io.engine.clients)[index];
        
        userDiv.innerHTML = `
          <span class="user-name">${escapeHtml(user.nickname)} ${user.isAdmin ? '👑' : ''}</span>
          <div class="user-actions">
            <select id="muteDuration-${index}">
              <option value="10">10秒</option>
              <option value="60">1分钟</option>
              <option value="300">5分钟</option>
              <option value="600">10分钟</option>
              <option value="3600">1小时</option>
              <option value="86400">24小时</option>
              <option value="custom">自定义...</option>
              <option value="permanent">永久</option>
            </select>
            <button onclick="muteUser(${index})">禁言</button>
            <button class="unmute" onclick="unmuteUser(${index})">解除</button>
          </div>
        `;
        
        userList.appendChild(userDiv);
      });
    }

    // ========== 管理功能 ==========

    function openAdminPanel() {
      document.getElementById('adminPanel').classList.add('show');
      document.getElementById('overlay').classList.add('show');
    }

    function closeAdminPanel() {
      document.getElementById('adminPanel').classList.remove('show');
      document.getElementById('overlay').classList.remove('show');
    }

    function adminLogin() {
      const password = document.getElementById('adminPassword').value;
      socket.emit('admin login', password);
    }

    socket.on('admin login success', () => {
      isAdmin = true;
      document.getElementById('adminLoginSection').style.display = 'none';
      document.getElementById('adminControls').style.display = 'block';
      showSystemMessage('管理员登录成功', 'success');
    });

    socket.on('admin login fail', (msg) => {
      alert(msg);
    });

    function muteUser(index) {
      if (!isAdmin) {
        alert('只有管理员才能禁言用户');
        return;
      }
      
      const select = document.getElementById(`muteDuration-${index}`);
      let duration = select.value;
      
      if (duration === 'custom') {
        const customSeconds = prompt('请输入禁言秒数（至少1秒）：');
        if (!customSeconds || isNaN(customSeconds) || parseInt(customSeconds) < 1) {
          alert('请输入有效的秒数');
          return;
        }
        duration = parseInt(customSeconds);
      } else if (duration !== 'permanent') {
        duration = parseInt(duration);
      }
      
      const socketId = Array.from(socket.io.engine.clients)[index];
      socket.emit('mute user', { targetId: socketId, duration });
    }

    function unmuteUser(index) {
      if (!isAdmin) {
        alert('只有管理员才能解除禁言');
        return;
      }
      
      const socketId = Array.from(socket.io.engine.clients)[index];
      socket.emit('unmute user', { targetId: socketId });
    }

    // ========== 工具函数 ==========

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function scrollToBottom() {
      const messagesArea = document.getElementById('messagesArea');
      messagesArea.scrollTop = messagesArea.scrollHeight;
    }

    // 初始化 favicon
    updateFavicon(0);
  </script>
</body>
</html>
