<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>聊天室</title>
  <style>
    /* 你的样式代码保持不变 */
  </style>
</head>
<body>
  <div id="chat">
    <div id="messages"></div>
    <input id="messageInput" type="text" placeholder="输入消息...">
    <button id="sendButton">发送</button>
  </div>

  <!-- 引入 Socket.IO 客户端库（必须） -->
  <script src="/socket.io/socket.io.js"></script>
  <script>
    // 连接服务器
    const socket = io();

    const messagesDiv = document.getElementById('messages');
    const messageInput = document.getElementById('messageInput');
    const sendButton = document.getElementById('sendButton');

    // 1. 接收服务器发送的历史消息（对应 server.js 的 socket.emit('allMessages', messages)）
    socket.on('allMessages', (messages) => {
      messagesDiv.innerHTML = '';  // 清空当前列表
      messages.forEach(msg => {
        const div = document.createElement('div');
        div.textContent = msg;
        messagesDiv.appendChild(div);
      });
    });

    // 2. 接收服务器广播的新消息（对应 server.js 的 io.emit('chat message', msg)）
    socket.on('chat message', (msg) => {
      const div = document.createElement('div');
      div.textContent = msg;
      messagesDiv.appendChild(div);
    });

    // 3. 点击发送按钮，向服务器发送消息（对应 server.js 的 socket.on('chat message', ...)）
    sendButton.onclick = () => {
      const msg = messageInput.value.trim();
      if (msg) {
        socket.emit('chat message', msg);  // 事件名必须与 server.js 一致
        messageInput.value = '';
      }
    };

    // 4. 按回车键发送
    messageInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        sendButton.click();
      }
    });
  </script>
</body>
</html>
