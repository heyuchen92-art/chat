<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聊天室</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 个人资料栏：昵称 + 预设头像选择 -->
    <div class="profile-bar">
        <span id="avatarPreview">😀</span>
        <input type="text" id="nicknameInput" placeholder="输入昵称">
        <div id="avatarOptions">
            <span class="avatar-option" data-avatar="😀">😀</span>
            <span class="avatar-option" data-avatar="😎">😎</span>
            <span class="avatar-option" data-avatar="🤖">🤖</span>
            <span class="avatar-option" data-avatar="🐱">🐱</span>
            <span class="avatar-option" data-avatar="🐶">🐶</span>
            <span class="avatar-option" data-avatar="🦊">🦊</span>
            <span class="avatar-option" data-avatar="🌸">🌸</span>
            <span class="avatar-option" data-avatar="⭐">⭐</span>
        </div>
    </div>

    <!-- 聊天消息区域 -->
    <div id="messages"></div>

    <!-- 消息输入区域 -->
    <div class="input-area">
        <input type="text" id="messageInput" placeholder="输入消息...">
        <button id="sendBtn">发送</button>
    </div>

    <!-- 所有脚本放在 body 末尾，确保 DOM 已加载 -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        // ===== 元素获取（此时 DOM 已完全加载，不会报 null 错误）=====
        const avatarPreview = document.getElementById('avatarPreview');
        const nicknameInput = document.getElementById('nicknameInput');
        const avatarOptions = document.querySelectorAll('.avatar-option');
        const messagesDiv = document.getElementById('messages');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');

        // ===== Socket.IO 连接 =====
        const socket = io();

        // ===== 预设头像选择 =====
        avatarOptions.forEach(function(option) {
            option.addEventListener('click', function() {
                const avatar = this.getAttribute('data-avatar');
                avatarPreview.textContent = avatar;
                localStorage.setItem('avatar', avatar);
            });
        });

        // ===== 昵称设置 =====
        nicknameInput.addEventListener('change', function() {
            localStorage.setItem('nickname', this.value);
        });

        // ===== 发送文本消息 =====
        function sendMessage() {
            const text = messageInput.value.trim();
            if (!text) return;
            const nickname = nicknameInput.value || '匿名用户';
            const avatar = localStorage.getItem('avatar') || '😀';
            socket.emit('chatMessage', { text, nickname, avatar });
            messageInput.value = '';
        }

        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') sendMessage();
        });

        // ===== 接收消息 =====
        socket.on('chatMessage', function(data) {
            appendMessage(data);
        });

        // ===== 历史记录 =====
        socket.on('history', function(history) {
            history.forEach(function(msg) {
                appendMessage(msg);
            });
        });

        // ===== 渲染消息（使用 emoji 头像，避免 Base64 乱码）=====
        function appendMessage(data) {
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message';

            // 头像直接用 emoji 文本显示，彻底避免 Base64 乱码问题
            const avatarSpan = document.createElement('span');
            avatarSpan.className = 'msg-avatar';
            avatarSpan.textContent = data.avatar || '😀';

            const contentDiv = document.createElement('div');
            contentDiv.className = 'msg-content';

            const nameSpan = document.createElement('span');
            nameSpan.className = 'msg-name';
            nameSpan.textContent = data.nickname || '匿名用户';

            const textDiv = document.createElement('div');
            textDiv.className = 'msg-text';
            textDiv.textContent = data.text;

            contentDiv.appendChild(nameSpan);
            contentDiv.appendChild(textDiv);
            msgDiv.appendChild(avatarSpan);
            msgDiv.appendChild(contentDiv);
            messagesDiv.appendChild(msgDiv);

            // 自动滚动到底部
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        // ===== 恢复本地存储的昵称和头像 =====
        const savedNickname = localStorage.getItem('nickname');
        const savedAvatar = localStorage.getItem('avatar');
        if (savedNickname) nicknameInput.value = savedNickname;
        if (savedAvatar) avatarPreview.textContent = savedAvatar;
    </script>
</body>
</html>
